name: Bug report
description: Something doesn't work
labels: [bug]
body:
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Live Calendar version
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Source type
      options: [CalDAV, ICS / webcal]
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Calendar provider
      description: e.g. Nextcloud, iCloud, Fastmail, Google (ICS)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / diagnostics
      description: Debug logs for `custom_components.live_calendar`. **Remove URLs, usernames and webhook ids.**
      render: text
